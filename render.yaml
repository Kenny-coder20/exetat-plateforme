# Déploiement Render (https://render.com) — Blueprint
# 1. Poussez ce dossier sur un dépôt GitHub.  2. Render → New → Blueprint → choisissez le dépôt.
# 3. Renseignez les deux variables marquées sync:false (clé API, mot de passe atelier).
services:
  - type: web
    name: exetat-plateforme
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: exetat-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ATELIER_MOT_DE_PASSE
        sync: false
      - key: ATELIER_UTILISATEUR
        value: atelier
      - key: MODELE_IA
        value: claude-sonnet-5-5
      - key: EXETAT_DEMO
        value: "1"

databases:
  - name: exetat-db
    plan: free
    region: frankfurt
    databaseName: exetat
    user: exetat
